apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node2ai-ingress
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: ingress
  annotations:
    # Nginx Ingress Controller
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '30'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '30'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '30'
    nginx.ingress.kubernetes.io/proxy-buffer-size: '16k'
    nginx.ingress.kubernetes.io/proxy-buffers-number: '8'
    nginx.ingress.kubernetes.io/client-max-body-size: '10m'

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Rate limiting
    nginx.ingress.kubernetes.io/rate-limit: '100'
    nginx.ingress.kubernetes.io/rate-limit-window: '1m'

    # CORS
    nginx.ingress.kubernetes.io/enable-cors: 'true'
    nginx.ingress.kubernetes.io/cors-allow-origin: 'https://yourdomain.com,https://admin.yourdomain.com'
    nginx.ingress.kubernetes.io/cors-allow-methods: 'GET, POST, PUT, DELETE, OPTIONS'
    nginx.ingress.kubernetes.io/cors-allow-headers: 'Content-Type, Authorization, X-API-Key, X-Request-ID'
    nginx.ingress.kubernetes.io/cors-allow-credentials: 'true'

    # Cert Manager
    cert-manager.io/cluster-issuer: 'letsencrypt-prod'

    # Monitoring
    nginx.ingress.kubernetes.io/enable-access-log: 'true'
    nginx.ingress.kubernetes.io/access-log-path: '/var/log/nginx/access.log'
    nginx.ingress.kubernetes.io/enable-error-log: 'true'
    nginx.ingress.kubernetes.io/error-log-path: '/var/log/nginx/error.log'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - yourdomain.com
        - api.yourdomain.com
        - admin.yourdomain.com
      secretName: node2ai-tls
  rules:
    # Main web application
    - host: yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node2ai-web
                port:
                  number: 3000
    # API endpoints
    - host: api.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node2ai-api
                port:
                  number: 3001
    # Admin interface (optional subdomain)
    - host: admin.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node2ai-web
                port:
                  number: 3000
---
# Optional: Separate API ingress for different routing rules
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node2ai-api-ingress
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: api-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '10m'

    # API-specific security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      add_header X-Frame-Options "DENY" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
      add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # API rate limiting (stricter)
    nginx.ingress.kubernetes.io/rate-limit: '50'
    nginx.ingress.kubernetes.io/rate-limit-window: '1m'

    # CORS for API
    nginx.ingress.kubernetes.io/enable-cors: 'true'
    nginx.ingress.kubernetes.io/cors-allow-origin: 'https://yourdomain.com,https://admin.yourdomain.com'
    nginx.ingress.kubernetes.io/cors-allow-methods: 'GET, POST, PUT, DELETE, OPTIONS'
    nginx.ingress.kubernetes.io/cors-allow-headers: 'Content-Type, Authorization, X-API-Key, X-Request-ID'
    nginx.ingress.kubernetes.io/cors-allow-credentials: 'true'

    # API-specific timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: '60'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '60'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '60'

    cert-manager.io/cluster-issuer: 'letsencrypt-prod'
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - api.yourdomain.com
      secretName: node2ai-api-tls
  rules:
    - host: api.yourdomain.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: node2ai-api
                port:
                  number: 3001
