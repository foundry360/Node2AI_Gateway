apiVersion: v1
kind: Service
metadata:
  name: node2ai-api
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: api
  annotations:
    prometheus.io/scrape: 'true'
    prometheus.io/port: '9090'
    prometheus.io/path: '/metrics'
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: node2ai-web
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      protocol: TCP
  selector:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/component: web
---
apiVersion: v1
kind: Service
metadata:
  name: node2ai-postgres
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      protocol: TCP
  selector:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/component: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: node2ai-redis
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
      protocol: TCP
  selector:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/component: redis
