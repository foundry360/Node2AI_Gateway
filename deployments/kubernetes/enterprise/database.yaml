apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: node2ai-postgres
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: postgres
spec:
  serviceName: node2ai-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: node2ai
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node2ai
        app.kubernetes.io/component: postgres
    spec:
      serviceAccountName: node2ai
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:14-alpine
          ports:
            - name: postgres
              containerPort: 5432
              protocol: TCP
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: node2ai-secrets
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: node2ai-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: node2ai-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          resources:
            requests:
              memory: '1Gi'
              cpu: '500m'
            limits:
              memory: '4Gi'
              cpu: '2000m'
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-scripts
              mountPath: /docker-entrypoint-initdb.d
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - node2ai
                - -d
                - node2ai
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - node2ai
                - -d
                - node2ai
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
      volumes:
        - name: init-scripts
          configMap:
            name: node2ai-postgres-init
  volumeClaimTemplates:
    - metadata:
        name: postgres-storage
      spec:
        accessModes: ['ReadWriteOnce']
        resources:
          requests:
            storage: 100Gi
        storageClassName: fast-ssd
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: node2ai-postgres-init
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: postgres
data:
  01-init-db.sql: |
    -- Node2AI Database Initialization
    CREATE EXTENSION IF NOT EXISTS "uuid-ossp";
    CREATE EXTENSION IF NOT EXISTS "pgcrypto";

    -- Create tables (simplified for brevity)
    CREATE TABLE IF NOT EXISTS organizations (
      id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
      name VARCHAR(255) NOT NULL,
      created_at TIMESTAMP DEFAULT CURRENT_TIMESTAMP
    );

    INSERT INTO organizations (id, name) VALUES 
    ('default-org', 'Default Organization') 
    ON CONFLICT (id) DO NOTHING;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node2ai-redis
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: node2ai
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node2ai
        app.kubernetes.io/component: redis
    spec:
      serviceAccountName: node2ai
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            [
              'redis-server',
              '--appendonly',
              'yes',
              '--requirepass',
              '$(REDIS_PASSWORD)',
            ]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: node2ai-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              memory: '256Mi'
              cpu: '100m'
            limits:
              memory: '1Gi'
              cpu: '500m'
          volumeMounts:
            - name: redis-storage
              mountPath: /data
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            capabilities:
              drop:
                - ALL
      volumes:
        - name: redis-storage
          persistentVolumeClaim:
            claimName: node2ai-redis-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node2ai-redis-pvc
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: redis
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 10Gi
  storageClassName: fast-ssd
