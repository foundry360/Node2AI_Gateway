apiVersion: v1
kind: ConfigMap
metadata:
  name: node2ai-config
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: config
data:
  # Application settings
  NODE_ENV: 'production'
  APP_NAME: 'Node2AI Enterprise'
  LOG_LEVEL: 'info'
  ENABLE_REQUEST_LOGGING: 'true'

  # Feature flags
  ENABLE_SANITIZATION: 'true'
  ENABLE_ANALYTICS: 'true'
  ENABLE_AUDIT_LOGS: 'true'
  ENABLE_RATE_LIMITING: 'true'
  ENABLE_CACHING: 'true'
  ENABLE_COMPRESSION: 'true'

  # Enterprise features
  ENABLE_SSO: 'false'
  ENABLE_MFA: 'true'
  ENABLE_RBAC: 'true'
  ENABLE_ADVANCED_ANALYTICS: 'true'

  # Performance tuning
  DATABASE_POOL_SIZE: '20'
  RATE_LIMIT_WINDOW: '60000'
  RATE_LIMIT_MAX: '100'

  # Monitoring
  ENABLE_METRICS: 'true'
  METRICS_PORT: '9090'
  METRICS_PATH: '/metrics'

  # Health checks
  HEALTH_CHECK_INTERVAL: '30000'
  HEALTH_CHECK_TIMEOUT: '5000'
  HEALTH_CHECK_RETRIES: '3'

  # API configuration
  API_TIMEOUT: '30000'
  API_MAX_REQUEST_SIZE: '10mb'
  API_MAX_FILES: '5'
  API_MAX_FILE_SIZE: '10mb'

  # Cache configuration
  CACHE_TTL: '3600'
  CACHE_MAX_SIZE: '1000'
  CACHE_CHECK_PERIOD: '600'

  # Compliance
  AUDIT_LOG_LEVEL: 'info'
  AUDIT_LOG_RETENTION_DAYS: '2555'
  AUDIT_LOG_ENCRYPTION: 'true'
  AUDIT_LOG_COMPRESSION: 'true'
  GDPR_ENABLED: 'true'
  GDPR_DATA_RETENTION_DAYS: '2555'
  SOC2_ENABLED: 'true'
  SOC2_AUDIT_LOGGING: 'true'
  SOC2_ACCESS_CONTROLS: 'true'

  # Security headers
  ENABLE_SECURITY_HEADERS: 'true'
  CSP_POLICY: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'"
  HSTS_MAX_AGE: '31536000'
  HSTS_INCLUDE_SUBDOMAINS: 'true'
  HSTS_PRELOAD: 'true'

  # CORS
  CORS_CREDENTIALS: 'true'
  CORS_METHODS: 'GET,POST,PUT,DELETE,OPTIONS'
  CORS_ALLOWED_HEADERS: 'Content-Type,Authorization,X-API-Key,X-Request-ID'

  # Email templates
  EMAIL_TEMPLATE_PATH: '/app/templates/email'
  EMAIL_DEFAULT_LOCALE: 'en'

  # Webhook configuration
  WEBHOOK_TIMEOUT: '5000'
  WEBHOOK_RETRY_ATTEMPTS: '3'

  # Custom integrations
  CUSTOM_PROVIDERS_ENABLED: 'false'
  CUSTOM_PROVIDERS_PATH: '/app/providers/custom'

  # Maintenance mode
  MAINTENANCE_MODE: 'false'
  MAINTENANCE_MESSAGE: 'Node2AI is currently under maintenance. Please try again later.'
  MAINTENANCE_ALLOWED_IPS: '127.0.0.1,::1'

  # Version information
  NODE2AI_VERSION: '1.0.0'
  BUILD_DATE: '2024-01-15'
