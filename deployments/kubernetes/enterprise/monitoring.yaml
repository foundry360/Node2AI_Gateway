apiVersion: v1
kind: ConfigMap
metadata:
  name: node2ai-prometheus-config
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - "node2ai_rules.yml"
    scrape_configs:
    - job_name: 'node2ai-api'
      static_configs:
      - targets: ['node2ai-api:9090']
      metrics_path: '/metrics'
      scrape_interval: 30s
    - job_name: 'node2ai-web'
      static_configs:
      - targets: ['node2ai-web:3000']
      metrics_path: '/metrics'
      scrape_interval: 30s
    - job_name: 'postgres'
      static_configs:
      - targets: ['node2ai-postgres:5432']
      scrape_interval: 30s
    - job_name: 'redis'
      static_configs:
      - targets: ['node2ai-redis:6379']
      scrape_interval: 30s
  node2ai_rules.yml: |
    groups:
    - name: node2ai.rules
      rules:
      - alert: Node2AIDown
        expr: up{job="node2ai-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Node2AI API is down"
          description: "Node2AI API has been down for more than 1 minute"
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value }} errors per second"
      - alert: HighMemoryUsage
        expr: (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage"
          description: "Memory usage is {{ $value }}% of limit"
      - alert: HighCPUUsage
        expr: (rate(container_cpu_usage_seconds_total[5m]) / container_spec_cpu_quota * container_spec_cpu_period) > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is {{ $value }}% of limit"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: node2ai-prometheus
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: node2ai
      app.kubernetes.io/component: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: node2ai
        app.kubernetes.io/component: prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:latest
          ports:
            - name: web
              containerPort: 9090
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--web.console.libraries=/etc/prometheus/console_libraries'
            - '--web.console.templates=/etc/prometheus/consoles'
            - '--storage.tsdb.retention.time=200h'
            - '--web.enable-lifecycle'
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus
            - name: prometheus-storage
              mountPath: /prometheus
          resources:
            requests:
              memory: '512Mi'
              cpu: '250m'
            limits:
              memory: '2Gi'
              cpu: '1000m'
      volumes:
        - name: prometheus-config
          configMap:
            name: node2ai-prometheus-config
        - name: prometheus-storage
          persistentVolumeClaim:
            claimName: node2ai-prometheus-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: node2ai-prometheus-pvc
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: monitoring
spec:
  accessModes: ['ReadWriteOnce']
  resources:
    requests:
      storage: 50Gi
  storageClassName: fast-ssd
---
apiVersion: v1
kind: Service
metadata:
  name: node2ai-prometheus
  namespace: node2ai-enterprise
  labels:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/instance: enterprise
    app.kubernetes.io/component: monitoring
spec:
  type: ClusterIP
  ports:
    - name: web
      port: 9090
      targetPort: 9090
      protocol: TCP
  selector:
    app.kubernetes.io/name: node2ai
    app.kubernetes.io/component: prometheus
