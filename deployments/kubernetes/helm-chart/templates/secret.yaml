apiVersion: v1
kind: Secret
metadata:
  name: {{ include "node2-enterprise.fullname" . }}-secret
  labels:
    {{- include "node2-enterprise.labels" . | nindent 4 }}
type: Opaque
data:
  # Database configuration
  database-url: {{ printf "postgresql://%s:%s@%s-postgresql:5432/%s" .Values.postgresql.auth.username .Values.postgresql.auth.password (include "node2-enterprise.fullname" .) .Values.postgresql.auth.database | b64enc }}
  
  # Redis configuration
  redis-url: {{ printf "redis://:%s@%s-redis-master:6379" .Values.redis.auth.password (include "node2-enterprise.fullname" .) | b64enc }}
  
  # Security configuration
  jwt-secret: {{ .Values.license.key | default "your-jwt-secret-here" | b64enc }}
  api-secret-key: {{ .Values.license.key | default "your-api-secret-here" | b64enc }}
  
  # License configuration
  license-key: {{ .Values.license.key | b64enc }}
  
  # Encryption key
  encryption-key: {{ .Values.license.key | default "your-encryption-key-here" | b64enc }}
  
  # Custom secrets
  {{- with .Values.secret.data }}
  {{- toYaml . | nindent 2 }}
  {{- end }}
