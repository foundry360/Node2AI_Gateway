apiVersion: v1
kind: ConfigMap
metadata:
  name: node2ai-config
  namespace: node2ai
data:
  NODE_ENV: 'production'
  DEPLOYMENT_MODE: 'self-hosted'
  LOG_LEVEL: 'info'
  DATA_SANITIZATION_ENABLED: 'true'
  EXTERNAL_AI_ENABLED: 'true'
  BLOCKCHAIN_ENABLED: 'true'
  NEXT_PUBLIC_APP_NAME: 'Node2AI'
  NEXT_PUBLIC_APP_VERSION: '1.0.0'
  CORS_ORIGINS: 'http://localhost:3000,http://localhost:3001'
  # Database configuration - update with your values
  POSTGRES_HOST: 'node2ai-postgres'
  POSTGRES_PORT: '5432'
  POSTGRES_USER: 'node2ai'
  POSTGRES_DB: 'node2ai'
  # Redis configuration
  REDIS_HOST: 'node2ai-redis'
  REDIS_PORT: '6379'
  # Application URLs
  NEXT_PUBLIC_API_URL: 'http://node2ai-api:3001'
