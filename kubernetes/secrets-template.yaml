# Node2AI Secrets Template
# Copy this file to secrets.yaml, fill in your values, then create the secret:
# kubectl create secret generic node2ai-secrets --from-file=secrets.yaml -n node2ai
#
# DO NOT commit secrets.yaml to version control!

apiVersion: v1
kind: Secret
metadata:
  name: node2ai-secrets
  namespace: node2ai
type: Opaque
stringData:
  # Database password
  POSTGRES_PASSWORD: 'CHANGE_ME_secure_password_here'

  # Redis password
  REDIS_PASSWORD: 'CHANGE_ME_redis_password_here'

  # Security secrets (generate with: openssl rand -hex 32)
  JWT_SECRET: 'CHANGE_ME_jwt_secret_32_bytes_minimum'
  ENCRYPTION_KEY: 'CHANGE_ME_encryption_key_32_bytes_minimum'
  API_KEY_SECRET: 'CHANGE_ME_api_key_secret_32_bytes_minimum'

  # License
  LICENSE_KEY: 'CHANGE_ME_your_license_key'
  LICENSE_TIER: 'enterprise'

  # AI Provider API Keys (at least one required)
  OPENAI_API_KEY: ''
  ANTHROPIC_API_KEY: ''
  GOOGLE_API_KEY: ''
  PERPLEXITY_API_KEY: ''
