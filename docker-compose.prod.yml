version: '3.8'

# Node2AI Production-like Local Testing Environment
# This configuration simulates production deployment with optimized builds,
# resource limits, and production-ready settings for local testing.

networks:
  node2-prod:
    driver: bridge
    name: node2-prod

volumes:
  postgres_data:
    name: node2-postgres-prod
  redis_data:
    name: node2-redis-prod
  ollama_models:
    name: node2-ollama-prod

services:
  # PostgreSQL Database (Production Configuration)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: node2-postgres-prod
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-node2}
      POSTGRES_USER: ${POSTGRES_USER:-node2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployments/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - node2-prod
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-node2} -d ${POSTGRES_DB:-node2}',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=100
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
      -c log_statement=all
      -c log_min_duration_statement=1000
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Redis Cache (Production Configuration)
  redis:
    image: redis:7-alpine
    container_name: node2-redis-prod
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - node2-prod
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'

  # Node2AI API Gateway (Production Build)
  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api
      args:
        NODE_ENV: production
        DEPLOYMENT_MODE: self-hosted
    container_name: node2-api-prod
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-self-hosted}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-node2}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-node2}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - LOG_LEVEL=info
      - DATA_SANITIZATION_ENABLED=${DATA_SANITIZATION_ENABLED:-true}
      - EXTERNAL_AI_ENABLED=${EXTERNAL_AI_ENABLED:-true}
      - LOCAL_LLM_ENABLED=${LOCAL_LLM_ENABLED:-false}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://ollama:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LICENSE_KEY=${LICENSE_KEY}
      - LICENSE_TIER=${LICENSE_TIER:-enterprise}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - node2-prod
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Node2AI Web Dashboard (Production Build)
  web:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.web
      args:
        NODE_ENV: production
    container_name: node2-web-prod
    restart: always
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-self-hosted}
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_NAME=Node2AI
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - LOG_LEVEL=info
    depends_on:
      api:
        condition: service_healthy
    networks:
      - node2-prod
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Ollama for Local LLM (Production Configuration)
  ollama:
    image: ollama/ollama:latest
    container_name: node2-ollama-prod
    restart: always
    ports:
      - '11434:11434'
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    networks:
      - node2-prod
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '3'
    profiles:
      - llm # Only start with --profile llm

  # Nginx Reverse Proxy (Production Configuration)
  nginx:
    image: nginx:alpine
    container_name: node2-nginx-prod
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deployments/docker/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - node2-prod
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    profiles:
      - proxy # Only start with --profile proxy
