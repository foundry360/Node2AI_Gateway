global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'node2ai'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - 'alerts.yml'

# Scrape configurations
scrape_configs:
  # Node2AI API metrics
  - job_name: 'node2ai-api'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['node2ai-api:3001']
        labels:
          service: 'api'
          component: 'node2ai'

  # Node2AI Web metrics
  - job_name: 'node2ai-web'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['node2ai-web:3000']
        labels:
          service: 'web'
          component: 'node2ai'

  # PostgreSQL exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # Node exporter (system metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node'
          component: 'system'
