version: '3.8'

# Node2AI Enterprise - Full Stack Production Deployment
# This configuration provides a complete, production-ready deployment
# with all services, monitoring, and security best practices.

networks:
  node2ai-network:
    driver: bridge
    name: node2ai-network

volumes:
  postgres_data:
    name: node2ai-postgres-data
  redis_data:
    name: node2ai-redis-data
  nginx_data:
    name: node2ai-nginx-data

services:
  # PostgreSQL Database (Production Configuration)
  postgres:
    image: pgvector/pgvector:pg15
    container_name: node2ai-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-node2ai}
      POSTGRES_USER: ${POSTGRES_USER:-node2ai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/init-schema.sql:ro
    networks:
      - node2ai-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-node2ai} -d ${POSTGRES_DB:-node2ai}',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=100
      -c shared_buffers=512MB
      -c effective_cache_size=2GB
      -c maintenance_work_mem=128MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=32MB
      -c default_statistics_target=100
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
        reservations:
          memory: 512M
          cpus: '0.25'

  # Redis Cache (Production Configuration)
  redis:
    image: redis:7-alpine
    container_name: node2ai-redis
    restart: always
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - node2ai-network
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.25'
        reservations:
          memory: 256M
          cpus: '0.1'

  # Node2AI API Gateway (Production Build)
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
      args:
        NODE_ENV: production
    image: node2ai/api:${VERSION:-latest}
    container_name: node2ai-api
    restart: always
    ports:
      - '3001:3001'
    environment:
      - NODE_ENV=production
      - DEPLOYMENT_MODE=self-hosted
      - DATABASE_URL=postgresql://${POSTGRES_USER:-node2ai}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-node2ai}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_KEY_SECRET=${API_KEY_SECRET}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:3001}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DATA_SANITIZATION_ENABLED=${DATA_SANITIZATION_ENABLED:-true}
      - EXTERNAL_AI_ENABLED=${EXTERNAL_AI_ENABLED:-true}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY:-}
      - LICENSE_KEY=${LICENSE_KEY}
      - LICENSE_TIER=${LICENSE_TIER:-enterprise}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - node2ai-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Node2AI Web Dashboard (Production Build)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
      args:
        NODE_ENV: production
    image: node2ai/web:${VERSION:-latest}
    container_name: node2ai-web
    restart: always
    ports:
      - '3000:3000'
    environment:
      - NODE_ENV=production
      - DEPLOYMENT_MODE=self-hosted
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      - NEXT_PUBLIC_APP_NAME=Node2AI
      - NEXT_PUBLIC_APP_VERSION=${VERSION:-1.0.0}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - node2ai-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # Nginx Reverse Proxy (Optional - Enable with profile)
  nginx:
    image: nginx:alpine
    container_name: node2ai-nginx
    restart: always
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_data:/var/cache/nginx
    depends_on:
      - api
      - web
    networks:
      - node2ai-network
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.25'
        reservations:
          memory: 128M
          cpus: '0.1'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    profiles:
      - proxy
