name: Gateway CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'gateway/**'
      - 'docs/**'
      - '.github/workflows/gateway.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'gateway/**'
      - 'docs/**'
      - '.github/workflows/gateway.yml'

jobs:
  gateway:
    name: Gateway test + typecheck
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Match root package.json "packageManager" (do not also set a different version).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install gateway deps
        working-directory: gateway
        run: pnpm install

      - name: Typecheck gateway
        working-directory: gateway
        run: pnpm typecheck

      - name: Test gateway
        working-directory: gateway
        env:
          GATEWAY_LOCAL_RUNTIME: stub
        run: pnpm test

      - name: Install admin deps
        working-directory: gateway/admin
        run: pnpm install

      - name: Typecheck admin
        working-directory: gateway/admin
        env:
          GATEWAY_URL: http://127.0.0.1:8080
          GATEWAY_ADMIN_API_KEY: ci_admin_key
        run: pnpm typecheck
