version: '3.8'

# Node2AI Development Environment
# This configuration is optimized for local development with hot reload
# and persistent data storage for databases and caches.

networks:
  node2-dev:
    driver: bridge
    name: node2-dev

volumes:
  postgres_data:
    name: node2-postgres-data
  redis_data:
    name: node2-redis-data
  ollama_models:
    name: node2-ollama-models

services:
  # PostgreSQL Database with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: node2-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-node2}
      POSTGRES_USER: ${POSTGRES_USER:-node2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployments/docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - node2-dev
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-node2} -d ${POSTGRES_DB:-node2}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    command: >
      postgres
      -c shared_preload_libraries=vector
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100

  # Redis Cache with password protection
  redis:
    image: redis:7-alpine
    container_name: node2-redis-dev
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:-changeme}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - node2-dev
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Node2AI API Gateway (Next.js)
  api:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.api.dev
    container_name: node2-api-dev
    restart: unless-stopped
    ports:
      - '3000:3000'
    volumes:
      # Hot reload: mount source code
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
      - ./node_modules:/app/node_modules
      # Exclude node_modules from host mount to avoid conflicts
      - /app/apps/api/node_modules
      - /app/packages/*/node_modules
    environment:
      - NODE_ENV=development
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-self-hosted}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-node2}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-node2}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-changeme}@redis:6379
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-change-in-production}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-dev-encryption-key-change-in-production}
      - API_KEY_SECRET=${API_KEY_SECRET:-dev-api-key-secret}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - LOG_LEVEL=debug
      - DATA_SANITIZATION_ENABLED=${DATA_SANITIZATION_ENABLED:-true}
      - EXTERNAL_AI_ENABLED=${EXTERNAL_AI_ENABLED:-true}
      - LOCAL_LLM_ENABLED=${LOCAL_LLM_ENABLED:-false}
      - LOCAL_LLM_URL=${LOCAL_LLM_URL:-http://ollama:11434}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - LICENSE_KEY=${LICENSE_KEY:-DEV-LICENSE-KEY}
      - LICENSE_TIER=${LICENSE_TIER:-enterprise}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - node2-dev
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ['pnpm', '--filter', '@node2/api', 'dev']

  # Node2AI Web Dashboard (Next.js)
  web:
    build:
      context: .
      dockerfile: deployments/docker/Dockerfile.web.dev
    container_name: node2-web-dev
    restart: unless-stopped
    ports:
      - '3001:3001'
    volumes:
      # Hot reload: mount source code
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
      - ./node_modules:/app/node_modules
      # Exclude node_modules from host mount
      - /app/apps/web/node_modules
      - /app/packages/*/node_modules
    environment:
      - NODE_ENV=development
      - DEPLOYMENT_MODE=${DEPLOYMENT_MODE:-self-hosted}
      - NEXT_PUBLIC_API_URL=http://localhost:3000
      - NEXT_PUBLIC_APP_NAME=Node2AI
      - NEXT_PUBLIC_APP_VERSION=1.0.0
      - LOG_LEVEL=debug
    depends_on:
      api:
        condition: service_healthy
    networks:
      - node2-dev
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3001']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    command: ['pnpm', '--filter', '@node2/web', 'dev']

  # Ollama for Local LLM Testing (Optional)
  ollama:
    image: ollama/ollama:latest
    container_name: node2-ollama-dev
    restart: unless-stopped
    ports:
      - '11434:11434'
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
    networks:
      - node2-dev
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # GPU support (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    profiles:
      - llm # Only start with --profile llm

  # Nginx Reverse Proxy (Optional for production-like setup)
  nginx:
    image: nginx:alpine
    container_name: node2-nginx-dev
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deployments/docker/nginx.dev.conf:/etc/nginx/nginx.conf:ro
      - ./deployments/docker/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
    networks:
      - node2-dev
    profiles:
      - proxy # Only start with --profile proxy
